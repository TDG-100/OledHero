[project]
name = "oledhero"
dynamic = ["version"]
description = "A quiet OLED protection utility that controls display brightness through DDC/CI."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.11.1",
]

[project.scripts]
oledhero = "oledhero.cli:main"

[dependency-groups]
dev = [
    "nuitka>=4.1.3",
    "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/oledhero/version.py"
