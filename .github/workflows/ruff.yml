name: Ruff

on:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    name: Lint and format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Ruff linter
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.0"
          args: check --output-format=github

      - name: Check Ruff formatting
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.0"
          args: format --check
