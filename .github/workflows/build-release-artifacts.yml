name: Build release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to build"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  prepare-build:
    name: Prepare build
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Check out build ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Resolve build commit
        id: commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify release tag matches application version
        if: github.event_name == 'push'
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          tag_pattern='^v[0-9]\.[0-9]{2}\.[0-9]{2}(_.+)?$'

          if [[ ! "$tag" =~ $tag_pattern ]]; then
            echo "Release tag $tag must use the form vX.XX.XX or vX.XX.XX_<anything>" >&2
            exit 1
          fi

          app_version="$(cut -d '"' -f 2 src/oledhero/version.py)"
          if [[ -z "$app_version" ]]; then
            echo "Unable to read the application version from src/oledhero/version.py" >&2
            exit 1
          fi

          expected_tag="v$app_version"
          version_tag="${tag%%_*}"

          if [[ "$version_tag" != "$expected_tag" ]]; then
            echo "Release tag version $version_tag does not match application version $app_version" >&2
            exit 1
          fi

  build-windows:
    name: Build Windows artifacts
    needs: prepare-build
    runs-on: windows-latest

    steps:
      - name: Check out build commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-build.outputs.commit }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Build Windows artifacts
        run: uv run --locked python scripts/build.py

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OledHero-Windows
          path: |
            dist/OledHero-*-Windows-x64.zip
            dist/OledHero-*-Windows-x64.exe
            dist/OledHero-*-Setup-x64.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux artifacts
    needs: prepare-build
    runs-on: ubuntu-latest

    steps:
      - name: Check out build commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-build.outputs.commit }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes patchelf

      - name: Build Linux artifacts
        run: uv run --locked python scripts/build.py

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OledHero-Linux
          path: |
            dist/OledHero-*-Linux-x64.zip
            dist/OledHero-*-Linux-x64
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: OledHero-*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create "$TAG_NAME" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "OledHero $TAG_NAME"
          fi
